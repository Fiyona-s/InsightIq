# ONE COMPANY'S STACK (Accounts A5, option C in docs/ACCOUNTS_PLAN.md): Caddy front door + front-end (nginx) + app, with the
# company's own data volume, secrets and network. Run it only through deploy/scripts/ (they pass --project-name and --env-file).
# The existing development compose.yaml at the project root is not used and not changed.
#
# Reachability: only Caddy publishes ports (80 and 443). The app and the front-end are on an internal network that has no
# route out and is not published. Secrets are files outside this file, outside the images and outside git.

services:
  caddy:
    image: caddy:2.11-alpine
    user: "65532:65532"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in company.env}
      PUBLIC_PORT_SUFFIX: ${PUBLIC_PORT_SUFFIX:-}
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0       # lets the non-root user bind 80 and 443 without any added capability
    networks:
      edge: {}
      internal:
        ipv4_address: ${CADDY_IP:?set CADDY_IP in company.env}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 3s
      retries: 5

  web:
    image: ${WEB_IMAGE:-insightiq-hosted-web:local}
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 5

  api:
    image: ${API_IMAGE:-insightiq-hosted-api:local}
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    working_dir: /tmp
    environment:
      APP_ENV: production
      AUTH_MODE: "on"
      AUTH_COOKIE_SECURE: "true"
      AUTH_OWNER_TOTP: "true"
      AUTH_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in company.env}
      AUTH_TRUSTED_PROXIES: ${CADDY_IP:?set CADDY_IP in company.env}/32
      AUTH_TOTP_KEY_FILE: /run/secrets/totp_key
      DATA_DIR: /data
      HOME: /tmp
      MPLCONFIGDIR: /tmp/mpl
    secrets:
      - totp_key
    volumes:
      - data:/data
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

networks:
  edge: {}
  internal:
    internal: true                                   # no route out of this network, nothing on it is published
    ipam:
      config:
        - subnet: ${INTERNAL_SUBNET:?set INTERNAL_SUBNET in company.env}
          ip_range: ${INTERNAL_RANGE:?set INTERNAL_RANGE in company.env}      # other containers get addresses from here, so the proxy's fixed address is never taken

volumes:
  data:
  caddy_data:
  caddy_config:

secrets:
  totp_key:
    file: ${COMPANY_DIR:?set COMPANY_DIR in company.env}/secrets/totp_key
