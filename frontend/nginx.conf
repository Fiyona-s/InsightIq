server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 110m;       # the app's own limit (MAX_UPLOAD_MB, default 30) is what applies; this only has to be larger
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;
    location /api/ { proxy_pass http://api:8000; proxy_read_timeout 600s; proxy_send_timeout 600s; proxy_request_buffering off; proxy_buffering off; proxy_cache off; proxy_http_version 1.1; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
